[default]
extend-ignore-re = ["\\b[0-9a-fA-F]{6}\\b", "\\bage1[02-9ac-hj-np-z]{58}\\b"]

[default.extend-identifiers]
FO27Q3 = "FO27Q3"
renderThinSeperatorBetweenTheScrollBar = "renderThinSeperatorBetweenTheScrollBar"

[default.extend-words]
dbe = "dbe"
donn = "donn"
facter = "facter"
hda = "hda"
